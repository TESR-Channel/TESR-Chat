project_id = "tesr-chat"

# Webhook ที่แพลตฟอร์มเรียกเข้ามาเอง ต้องปิดการตรวจ JWT (เราตรวจลายเซ็นของแพลตฟอร์มแทน)
[functions.line-webhook]
verify_jwt = false

[functions.meta-webhook]
verify_jwt = false

# เรียกจากหน้าเว็บ (ต้องล็อกอิน)
[functions.send-message]
verify_jwt = true

[functions.admin-api]
verify_jwt = true

# เรียกจาก pg_cron ทุก 20 วินาที (ตรวจด้วย x-sync-key จากตาราง app_secrets แทน JWT)
[functions.meta-sync]
verify_jwt = false

# เรียกจาก pg_cron ทุก 5 นาที (ตรวจ token/webhook ทุกช่องทาง)
[functions.health-check]
verify_jwt = false
