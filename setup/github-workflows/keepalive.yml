name: Keep Supabase awake

# Supabase แพ็กเกจฟรีจะหยุดโปรเจกต์ถ้าไม่มีการใช้งาน 7 วัน
# workflow นี้เรียกฐานข้อมูลทุก 3 วัน กันไว้ช่วงวันหยุดยาว
on:
  schedule:
    - cron: "17 2 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping
        run: |
          curl -fsS "${{ vars.SUPABASE_URL }}/rest/v1/staff?select=id&limit=1" \
            -H "apikey: ${{ vars.SUPABASE_ANON_KEY }}" -o /dev/null -w "%{http_code}\n"
