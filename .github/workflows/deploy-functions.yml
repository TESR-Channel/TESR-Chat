name: Deploy Supabase functions

on:
  push:
    branches: [main]
    paths: ["supabase/functions/**", "supabase/config.toml", ".github/workflows/deploy-functions.yml"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Check secrets
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$PROJECT_REF" ]; then
            echo "::error::ยังไม่ได้ตั้ง SUPABASE_ACCESS_TOKEN / SUPABASE_PROJECT_REF ใน Settings > Secrets"
            exit 1
          fi

      # ค่าการเชื่อมต่อทุกช่องทางตั้งจากหน้าเว็บ > ตั้งค่า แล้ว
      # ถ้าใส่ LINE_* ไว้ใน GitHub Secrets ด้วย จะใช้เป็นค่าสำรอง
      - name: Set fallback LINE secrets (optional)
        env:
          LINE_SECRET: ${{ secrets.LINE_CHANNEL_SECRET }}
          LINE_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
        run: |
          if [ -n "$LINE_SECRET" ] && [ -n "$LINE_TOKEN" ]; then
            supabase secrets set --project-ref "$PROJECT_REF" \
              LINE_CHANNEL_SECRET="$LINE_SECRET" LINE_CHANNEL_ACCESS_TOKEN="$LINE_TOKEN"
          else
            echo "ข้าม: ใช้ค่าจากหน้าตั้งค่าในเว็บ"
          fi

      - name: Deploy functions
        run: supabase functions deploy --project-ref "$PROJECT_REF"
